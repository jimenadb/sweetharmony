<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — Sweet Harmony</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../css/Admin_view.css">
  <link rel="stylesheet" href="../css/Admin_order.css">

  <style>
    /* Wrapper y sidebar */
    
    /* --- WRAPPER --- */
#wrapper {
  display: flex;
  width: 100%;
}

/* Sidebar colapsado */
#wrapper.toggled #sidebar-wrapper {
  transform: translateX(-250px);
}

/* Sidebar fijo */
#sidebar-wrapper {
  width: 250px;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
  background-color: #f8f9fa;
  border-right: 1px solid #ddd;
  transition: transform 0.3s;
  z-index: 1000;
}

/* Page content */
#page-content-wrapper {
  flex: 1;
  padding-left: 250px; /* reemplaza margin-left */
  transition: padding-left 0.3s;
}

/* Cuando sidebar está colapsado */
#wrapper.toggled #page-content-wrapper {
  padding-left: 0;
}

    /* Navbar sticky */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    main {
      flex: 1;
      padding: 1rem 2rem;
    }

    body {
      font-family: 'Urbanist', sans-serif;
    }
    
  </style>
</head>

<body>

  <div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div class="bg-light border-end position-fixed vh-100" id="sidebar-wrapper">
      <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-primary">SWEET HARMONY</div>
      <div class="list-group list-group-flush">
        <a href="Admin_view_B.html" class="list-group-item list-group-item-action bg-light">INICIO</a>
        <a href="Admin_catalogo_B.html" class="list-group-item list-group-item-action bg-light">CATÁLOGO</a>
        <a href="Admin_blog_B.html" class="list-group-item list-group-item-action bg-light">BLOG</a>
        <a href="Admin_order_B.html" class="list-group-item list-group-item-action bg-light">PEDIDOS</a>
      </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100" style="margin-left:250px;">

      <!-- Top navbar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom d-flex align-items-center">
        <div class="container-fluid d-flex align-items-center">
          <button class="btn btn-primary me-3" id="menu-toggle">☰</button>
          <div class="ms-auto d-flex align-items-center gap-2">
            <!-- Botón Admin -->
            <a href="Edit_Admin_B.html" class="btn btn-outline-success d-flex align-items-center gap-1" id="adminBtn">
              <ion-icon name="person-outline" style="font-size: 1.3rem;"></ion-icon>
              <span class="d-none d-md-inline">Admin</span>
            </a>
            <!-- Botón Logout -->
            <button class="btn btn-outline-danger d-flex align-items-center gap-1" id="logoutBtn">
              <ion-icon name="log-out-outline" style="font-size: 1.3rem;"></ion-icon>
              <span class="d-none d-md-inline">Salir</span>
            </button>
          </div>
        </div>
      </nav>

      <!-- Contenido principal -->
      <main class="container my-4">
        <h1 class="text-center mb-4">Gestión de Pedidos</h1>

        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead class="table-success">
              <tr>
                <th></th>
                <th>ID Pedido</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Dirección</th>
                <th>Fecha de Pedido</th>
                <th>Actualizar Estado</th>
                <th>Actualizar Envío</th>
              </tr>
            </thead>
            <tbody id="tablaPedidos"></tbody>
          </table>
        </div>

        <div id="accionesPedido" class="text-center mb-4">
          <button id="btnVerDetalles" class="btn btn-primary">Ver Detalles</button>
        </div>

        <!-- Modal Estado -->
        <div id="modalEstado" class="modal">
          <div class="modal-content">
            <span id="cerrarModalEstado" class="close-btn">&times;</span>
            <form id="formActualizarEstado">
              <h3>Actualizar Estado del Pedido</h3>
              <input type="hidden" id="order_id" name="order_id">
              <label for="status">Nuevo estado:</label>
              <select id="status" name="status" class="form-select" required>
                <option value="processing">En proceso</option>
                <option value="paid">Pagado</option>
                <option value="shipped">Enviado</option>
                <option value="delivered">Entregado</option>
                <option value="completed">Completado</option>
                <option value="cancelled">Cancelado</option>
              </select>
              <button type="submit" class="btn btn-primary w-100">Actualizar</button>
            </form>
          </div>
        </div>

        <!-- Modal Datos Envío -->
        <div id="modalDatosEnvio" class="modal">
          <div class="modal-content">
            <span id="cerrarModalEnvio" class="close-btn">&times;</span>
            <form id="formActualizarEnvio" enctype="multipart/form-data">
              <h3>Actualizar Datos de Envío</h3>
              <input type="hidden" id="order_id_envio" name="order_id">

              <label for="courier">Courier:</label>
              <input type="text" id="courier" name="courier" placeholder="Nombre del courier" class="form-control">

              <label for="tracking_number">Número de tracking:</label>
              <input type="text" id="tracking_number" name="tracking_number" placeholder="Número de seguimiento" class="form-control">

              <label for="shipping_notes">Notas del envío:</label>
              <textarea id="shipping_notes" name="shipping_notes" rows="3" placeholder="Notas o instrucciones de envío" class="form-control"></textarea>

              <label for="shipping_receipt">Comprobante de envío (foto/PDF):</label>
              <input type="file" id="shipping_receipt" name="shipping_receipt" accept="image/*,.pdf" class="form-control">

              <button type="submit" class="btn btn-primary w-100 mt-2">Actualizar Envío</button>
            </form>
          </div>
        </div>

      </main>

    </div>
    <!-- /#page-content-wrapper -->

  </div>
  <!-- /#wrapper -->

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script src="../js/Admin_order.js" defer></script>
  <script src="../js/Admin_view.js" defer></script>
  <script src="../js/logout.js" defer></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Toggle sidebar
    const menuToggle = document.getElementById('menu-toggle');
    const wrapper = document.getElementById('wrapper');
    menuToggle.addEventListener('click', () => {
      wrapper.classList.toggle('toggled');
    });
  </script>

</body>
</html>
