<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Sweet Harmony</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/Admin_catalogo.css">
  <link rel="stylesheet" href="../css/Admin_catalogo_B.css">
</head>
<body>

<div class="d-flex" id="wrapper">

  <!-- Sidebar -->
  <div class="bg-light border-end" id="sidebar-wrapper">
    <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-primary">SWEET HARMONY</div>
    <div class="list-group list-group-flush">
      <a href="Admin_view_B.html" class="list-group-item list-group-item-action bg-light">INICIO</a>
      <a href="Admin_catalogo_B.html" class="list-group-item list-group-item-action bg-light">CATÁLOGO</a>
      <a href="Admin_blog_B.html" class="list-group-item list-group-item-action bg-light">BLOG</a>
      <a href="Admin_order_B.html" class="list-group-item list-group-item-action bg-light">PEDIDOS</a>
    </div>
  </div>
  <!-- /#sidebar-wrapper -->

  <!-- Page Content -->
  <div id="page-content-wrapper" class="w-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container-fluid">
        <button class="btn btn-primary" id="menu-toggle">☰</button>
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="Edit_Admin.html" class="btn btn-outline-success d-flex align-items-center gap-1" id="adminBtn">
            <ion-icon name="person-outline" style="font-size: 1.3rem;"></ion-icon>
            <span class="d-none d-md-inline">Admin</span>
          </a>
          <button class="btn btn-outline-danger d-flex align-items-center gap-1" id="logoutBtn">
            <ion-icon name="log-out-outline" style="font-size: 1.3rem;"></ion-icon>
            <span class="d-none d-md-inline">Salir</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid p-4">

      <h1 class="mb-4">Mantenimiento de Productos</h1>

      <div class="d-flex gap-2 mb-3 flex-wrap">
        <button id="btnAgregar" class="btn btn-success d-flex align-items-center gap-1">
          <ion-icon name="add-circle-outline"></ion-icon> Agregar producto
        </button>
        <button id="btnTipos" class="btn btn-secondary d-flex align-items-center gap-1">
          <ion-icon name="options-outline"></ion-icon> Editar tipos
        </button>
      </div>

      <!-- Tabla de productos -->
      <div class="table-responsive" style="max-height:65vh; overflow-y:auto;">
        <table class="table table-striped table-hover align-middle text-center">
          <thead class="table-primary position-sticky top-0">
            <tr>
              <th>Imagen</th>
              <th>Nombre</th>
              <th>Tipo Producto</th>
              <th>Tipo Planta</th>
              <th>Precio</th>
              <th>Descuento (%)</th>
              <th>Alto Planta</th>
              <th>Ancho Planta</th>
              <th>Alto Maceta</th>
              <th>Ancho Maceta</th>
              <th>Color Maceta</th>
              <th>Peso (kg)</th>
              <th>Unidades</th>
              <th>Descripción</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>

      <!-- Panel externo acciones -->
      <div class="d-flex justify-content-between align-items-center mt-3 p-2 border rounded bg-light">
        <span id="productoSeleccionado">Selecciona un producto para editar</span>
        <div class="d-flex gap-2">
          <button id="btnEditar" class="btn btn-warning">Editar</button>
          <button id="btnEliminar" class="btn btn-danger">Eliminar</button>
        </div>
      </div>

    </main>

  </div>
  <!-- /#page-content-wrapper -->

</div>
<!-- /#wrapper -->

<!-- JS -->
<script src="../js/Admin_view.js" defer></script>
<script src="../js/Admin_catalogo.js" defer></script>
<script src="../js/save_products.js" defer></script>
<script src="../js/show_products.js" defer></script>
<script src="../js/update_products.js" defer></script>
<script src="../js/Admin_catalogo_tipos.js" defer></script>
<script src="../js/get_tipos_catalogo.js" defer></script>
<script src="../IAdescripcion/descripcion.js" defer></script>
<script src="../js/Admin_catalogo_B.js" defer></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
<script src="../js/logout.js" defer></script>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const wrapper = document.getElementById('wrapper');
  menuToggle.addEventListener('click', () => wrapper.classList.toggle('toggled'));
</script>

</body>
</html>
