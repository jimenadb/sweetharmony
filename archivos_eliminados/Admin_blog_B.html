<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento del Blog — Sweet Harmony</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Iconos -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="../css/Admin_view.css">
  
  <link rel="stylesheet" href="../css/Admin_blog.css">
  

  <style>
    /* Wrapper y sidebar */
    
    /* --- WRAPPER --- */
#wrapper {
  display: flex;
  width: 100%;
}

/* Sidebar colapsado */
#wrapper.toggled #sidebar-wrapper {
  transform: translateX(-250px);
}

/* Sidebar fijo */
#sidebar-wrapper {
  width: 250px;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
  background-color: #f8f9fa;
  border-right: 1px solid #ddd;
  transition: transform 0.3s;
  z-index: 1000;
}

/* Page content */
#page-content-wrapper {
  flex: 1;
  padding-left: 250px; /* reemplaza margin-left */
  transition: padding-left 0.3s;
}

/* Cuando sidebar está colapsado */
#wrapper.toggled #page-content-wrapper {
  padding-left: 0;
}

    /* Navbar sticky */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    main {
      flex: 1;
      padding: 1rem 2rem;
    }

    body {
      font-family: 'Urbanist', sans-serif;
    }
    
  </style>
</head>
<body>

<div id="wrapper">

  <!-- Sidebar -->
  <div id="sidebar-wrapper" class="border-end">
    <div class="sidebar-heading text-center py-4 fs-4 fw-bold text-primary">SWEET HARMONY</div>
    <div class="list-group list-group-flush">
      <a href="Admin_view_B.html" class="list-group-item list-group-item-action bg-light">INICIO</a>
      <a href="Admin_catalogo_B.html" class="list-group-item list-group-item-action bg-light">CATÁLOGO</a>
      <a href="Admin_blog_B.html" class="list-group-item list-group-item-action bg-light">BLOG</a>
      <a href="Admin_order_B.html" class="list-group-item list-group-item-action bg-light">PEDIDOS</a>
    </div>
  </div>

  <!-- Page Content -->
  <div id="page-content-wrapper">

    <!-- Top navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container-fluid d-flex align-items-center">
        <button class="btn btn-primary me-3" id="menu-toggle">☰</button>
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="Edit_Admin.html" class="btn btn-outline-success d-flex align-items-center gap-1" id="adminBtn">
            <ion-icon name="person-outline" style="font-size: 1.3rem;"></ion-icon>
            <span class="d-none d-md-inline">Admin</span>
          </a>
          <button class="btn btn-outline-danger d-flex align-items-center gap-1" id="logoutBtn">
            <ion-icon name="log-out-outline" style="font-size: 1.3rem;"></ion-icon>
            <span class="d-none d-md-inline">Salir</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid">
      <h1 class="mb-4">Mantenimiento del Blog</h1>

      <!-- Botón Agregar Entrada -->
      <div class="mb-3">
        <button class="btn btn-success" id="toggleFormBtn">
           Agregar entrada
        </button>
      </div>

      <!-- Formulario del modal -->
      <section class="modal" id="newPostSection">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Nuevo Post</h2>
            <button class="close-btn" id="closeNewPostModal">&times;</button>
          </div>

          <form id="newPostForm" enctype="multipart/form-data">
            <input type="hidden" id="postId" name="id">

            <div class="form-group mb-2">
              <label for="title">Título</label>
              <input type="text" id="title" name="title" class="form-control" required>
            </div>

            <div class="form-group mb-2">
              <label for="content">Descripción</label>
              <textarea id="content" name="content" rows="4" class="form-control" required></textarea>
            </div>

            <div class="form-group mb-2">
              <label for="image">Imagen</label>
              <input type="file" id="image" name="image" accept="image/*" class="form-control">
              <div id="imagePreview" class="mt-2">
                <img id="previewImg" src="" alt="Preview" style="display:none; width:100px; height:100px; object-fit:cover; border:1px solid #ccc; border-radius:4px;">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">Guardar</button>
          </form>
        </div>
      </section>

      <!-- Entradas Publicadas -->
      <section class="mt-4">
        <h2>Entradas publicadas</h2>
        <div class="table-container">
          <table class="table table-striped table-hover">
            <thead class="table-success">
              <tr>
                <th>Titulo</th>
                <th>Fecha</th>
                <th>Contenido</th>
                <th>Imagen</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="blogPostsTable"></tbody>
          </table>
        </div>
      </section>
    </main>

  </div>
  <!-- /#page-content-wrapper -->

</div>
<!-- /#wrapper -->

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/save_blog.js" defer></script>
<script src="../js/Admin_blog.js" defer></script>
<script src="../js/show_blog.js" defer></script>
<script src="../js/Admin_view.js" defer></script>
<script src="../js/logout.js" defer></script>

<script>
  const menuToggle = document.getElementById('menu-toggle');
  const wrapper = document.getElementById('wrapper');
  menuToggle.addEventListener('click', () => {
    wrapper.classList.toggle('toggled');
  });
</script>

</body>
</html>
