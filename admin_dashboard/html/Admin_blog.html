<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento del Blog — Sweet Harmony</title>

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/Admin_view.css">
  <link rel="stylesheet" href="../css/Admin_blog.css">

  <!-- Iconos -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-top" data-header>
      <div class="container">
        <button class="nav-open-btn" aria-label="open menu" data-nav-toggler>
          <span class="line line-1"></span>
          <span class="line line-2"></span>
          <span class="line line-3"></span>
        </button>
        <a href="#" class="logo">SWEET- HARMONY - ADMINISTRADOR</a>
        <div class="header-actions">
          <button class="header-action-btn" id="logoutBtn" aria-label="Cerrar sesión">
            <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
          </button>
        </div>
        <nav class="navbar">
          <ul class="navbar-list">
            <li><a href="Admin_catalogo.html" class="navbar-link has-after">CATÁLOGO</a></li>
            <li><a href="Admin_blog.html" class="navbar-link has-after">BLOG</a></li>
            <li><a href="Admin_order.html" class="navbar-link has-after">PEDIDOS</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- MOBILE NAVBAR -->
  <div class="sidebar">
    <div class="mobile-navbar" data-navbar>
      <div class="wrapper">
        <a href="#" class="logo"><img src="../assets/logo.png" width="179" height="26" alt="Glowing"></a>
        <button class="nav-close-btn" aria-label="close menu" data-nav-toggler>
          <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
      <ul class="navbar-list">
        <li><a href="Admin_catalogo.html" class="navbar-link" data-nav-link>CATÁLOGO</a></li>
        <li><a href="Admin_blog.html" class="navbar-link has-after">BLOG</a></li>
        <li><a href="Admin_order.html" class="navbar-link has-after">PEDIDOS</a></li>
      </ul>
    </div>
    <div class="overlay" data-nav-toggler data-overlay></div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="container">
    <h1>Mantenimiento del Blog</h1>

    <!-- Botón Agregar Entrada -->
    <div class="btn-wrapper">
      <button class="add-entry-btn" id="toggleFormBtn">
        <ion-icon name="add-circle-outline"></ion-icon> Agregar entrada
      </button>
    </div>

<!-- Formulario del modal -->
<section class="modal" id="newPostSection">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Nuevo Post</h2>
      <button class="close-btn" id="closeNewPostModal">&times;</button>
    </div>

    <form id="newPostForm" enctype="multipart/form-data">
      <!-- ID oculto para edición -->
      <input type="hidden" id="postId" name="id">

      <div class="form-group">
        <label for="title">Título</label>
        <input type="text" id="title" name="title" required>
      </div>

      <div class="form-group">
        <label for="content">Descripción</label>
        <textarea id="content" name="content" rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="image">Imagen</label>
        <input type="file" id="image" name="image" accept="image/*">
        <!-- Preview de imagen -->
        <div id="imagePreview" style="margin-top: 0.5rem;">
          <img id="previewImg" src="" alt="Preview" style="display:none; width:100px; height:100px; object-fit:cover; border:1px solid #ccc; border-radius:4px;">
        </div>
      </div>

      <button type="submit">Guardar</button>
    </form>
  </div>
</section>


    <!-- Entradas Publicadas -->
    <section>
      <h1>Entradas publicadas</h1>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Titulo</th>
              <th>Fecha</th>
              <th>Contenido</th>
              <th>Imagen</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="blogPostsTable"></tbody>
        </table>
      </div>
    </section>
  </main>

 

  <!-- Scripts -->
  <script src="../js/save_blog.js" defer></script>
  <script src="../js/Admin_blog.js" defer></script>
  <script src="../js/show_blog.js" defer></script>
  <script src="../js/Admin_view.js" defer></script>
  <script src="../js/logout.js" defer></script>
</body>
</html>
