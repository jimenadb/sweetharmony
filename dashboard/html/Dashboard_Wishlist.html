<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - SWEET HARMONY</title>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/Dahsboard_Wishlist.css">
</head>
<body>
  <div class="container">
    <h1 class="h1">Mis Favoritos</h1>

    <table class="wishlist-table">
      <thead>
        <tr>
          <th><input type="checkbox" id="select-all"></th>
          <th>Producto</th>
          <th>Precio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="checkbox" class="select-item"></td>
          <td class="product-info">
            <img src="producto1.jpg" alt="Producto 1">
            <span>Caramelos Arcor Halloween</span>
          </td>
          <td class="price">$5.50</td>
          <td>
            <button class="btn btn-secondary remove-btn">Eliminar</button>
            <button class="btn btn-primary add-cart-btn">Agregar al carrito</button>
          </td>
        </tr>
        <tr>
          <td><input type="checkbox" class="select-item"></td>
          <td class="product-info">
            <img src="producto2.jpg" alt="Producto 2">
            <span>Mochila Gatito 75g</span>
          </td>
          <td class="price">$7.25</td>
          <td>
            <button class="btn btn-secondary remove-btn">Eliminar</button>
            <button class="btn btn-primary add-cart-btn">Agregar al carrito</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="wishlist-actions">
      <button class="btn btn-secondary" id="remove-selected">Eliminar seleccionados</button>
      <button class="btn btn-primary" id="add-selected-cart">Agregar seleccionados al carrito</button>
    </div>
  </div>
</body>
</html>
