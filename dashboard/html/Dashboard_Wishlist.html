<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - SWEET HARMONY</title>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/Dahsboard_Wishlist.css">
</head>
<body>
  <div class="wishlist-container">
    <h1 class="wishlist-title">Mis Favoritos</h1>
    <table class="wishlist-table">
      <thead>
        <tr>
          <th>Imagen</th>
          <th>Producto</th>
          <th>Precio</th>
          <th>Descuento</th>
          <th>Precio Final</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="product-info"><span></span></td>
          <td class="product-name"></td>
          <td class="price"></td>
          <td class="discount"></td>
          <td class="total_price"></td>
          <td>
            <button class="btn btn-secondary remove-btn">Eliminar</button>
            <button class="btn btn-primary add-cart-btn">Agregar al carrito</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <script src="../js/Dashboard_Whislist.js" defer></script>
  <script src="../../components/back_button.js"></script>
</body>
</html>
