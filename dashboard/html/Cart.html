<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - Ejemplo</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
    img { width: 80px; height: auto; }
    .total { text-align: right; font-weight: bold; margin-top: 20px; }
    .empty { text-align: center; padding: 50px; font-size: 1.2em; color: #555; }
    .btn-clear { margin-top: 20px; padding: 10px 15px; background: #ff4d4d; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Carrito de Compras</h1>

  <div id="cartContainer">
    <table id="cartTable">
      <thead>
        <tr>
          <th>Imagen</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody id="cartBody">
        <!-- Productos se agregan dinámicamente -->
      </tbody>
    </table>

    <div class="total" id="cartTotal">Total: $0.00</div>
    <button class="btn-clear" id="clearCartBtn">Vaciar Carrito</button>
  </div>

  <div id="emptyCart" class="empty" style="display:none;">El carrito está vacío.</div>

  <script>
    const cartBody = document.getElementById("cartBody");
    const cartTotal = document.getElementById("cartTotal");
    const emptyCart = document.getElementById("emptyCart");
    const clearBtn = document.getElementById("clearCartBtn");

    // --- Datos de ejemplo (simula productos en el carrito) ---
    const exampleCart = [
      { id: 1, name: "Planta Ficus", price: 25.50, quantity: 2, image: "product-01.jpg" },
      { id: 2, name: "Maceta Decorativa", price: 15.00, quantity: 1, image: "product-02.jpg" },
      { id: 3, name: "Terrario Pequeño", price: 40.00, quantity: 1, image: "product-03.jpg" }
    ];

    // Guardar en localStorage para simular carrito activo
    localStorage.setItem("cart", JSON.stringify(exampleCart));

    function renderCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];

      if(cart.length === 0) {
        document.getElementById("cartContainer").style.display = "none";
        emptyCart.style.display = "block";
        return;
      }

      document.getElementById("cartContainer").style.display = "block";
      emptyCart.style.display = "none";

      cartBody.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        const subtotal = item.price * item.quantity;
        total += subtotal;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td><img src="../assets/${item.image}" alt="${item.name}"></td>
          <td>${item.name}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>${item.quantity}</td>
          <td>$${subtotal.toFixed(2)}</td>
        `;
        cartBody.appendChild(row);
      });

      cartTotal.textContent = `Total: $${total.toFixed(2)}`;
    }

    clearBtn.addEventListener("click", () => {
      if(confirm("¿Deseas vaciar el carrito?")) {
        localStorage.removeItem("cart");
        renderCart();
      }
    });

    // Inicializar carrito
    renderCart();
  </script>

</body>
</html>
