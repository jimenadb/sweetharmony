<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Direcciones</title>
  <link rel="stylesheet" href="../css/User_Address.css">
</head>
<body>
  <section class="address-section">
    <h2>Mis Direcciones de Entrega</h2>
    <button id="add-address-btn" class="btn btn-primary">+ Agregar Nueva Dirección</button><br>
    <div id="address-list" class="address-list"></div>
    
  </section>
  <div id="address-modal" class="modal">
    <div class="modal-content">
      <div class="modal-scroll">
      <span class="close-btn">&times;</span>
      <h3>Agregar / Editar Dirección</h3>
      <form id="address-form">
        <input type="hidden" name="id" id="address-id">
        <label>Nombre completo</label>
        <input type="text" name="full_name" id="full_name" required>
        <label>Email</label>
        <input type="email" name="email" id="email" required>
        <label>DNI</label>
        <input type="text" name="dni" id="dni" required>
        <label>Dirección</label>
        <input type="text" name="address" id="address" required>
        <label>Distrito</label>
        <input type="text" name="district" id="district" required>
        <label>Ciudad</label>
        <input type="text" name="city" id="city" required>
        <label>Código Postal</label>
        <input type="text" name="postal_code" id="postal_code" required>
        <label>Referencia</label>
        <input type="text" name="reference" id="reference">
        <label>
          <input type="checkbox" name="is_default" id="is_default">
          Predeterminada
        </label>
        <button type="submit" class="btn btn-primary">Guardar Dirección</button>
      </form>
      </div>
    </div>
  </div>
  <script src="../js/User_Address.js" defer></script>
  <script src="../../components/back_button.js"></script>
</body>
</html>
