<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <!-- 
        - custom css link
        -->
        <link rel="stylesheet" href="../css/User_Address.css">

</head>
<body>
    <section class="address-section">
        <h2>Mis Direcciones de Entrega</h2>
        <div id="address-list" class="address-list"></div>
      
        <button id="add-address-btn" class="btn btn-primary">+ Agregar Nueva Dirección</button>
      </section>
      
       <!-- ===================
    POPUP FORMULARIO
  =================== -->
  <div id="address-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h3>Agregar / Editar Dirección</h3>
  
      <form id="address-form">
        <input type="hidden" name="id" id="address-id">
  
        <label>Full Name</label>
        <input type="text" name="full_name" id="full_name" required>
  
        <label>DNI</label>
        <input type="text" name="dni" id="dni" required>
  
        <label>Address</label>
        <input type="text" name="address" id="address" required>
  
        <label>District</label>
        <input type="text" name="district" id="district" required>
  
        <label>City</label>
        <input type="text" name="city" id="city" required>
  
        <label>Postal Code</label>
        <input type="text" name="postal_code" id="postal_code" required>
  
        <label>Reference</label>
        <input type="text" name="reference" id="reference" required>
  
        <label class="checkbox">
          <input type="checkbox" name="is_default" id="is_default">
          Set as default
        </label>
  
        <button type="submit" class="btn btn-primary">Save Address</button>
      </form>
    </div>
  </div>
  

      <!-- 
        - custom script link
        -->
        <script src="../js/User_Address.js" defer></script>
</body>
</html>
